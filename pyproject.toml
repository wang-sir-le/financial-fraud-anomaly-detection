[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudx"
version = "0.2.0"
description = "Reproducible temporal and cost-sensitive financial fraud experiments"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4",
  "lightgbm>=4.6",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "PyYAML>=6.0",
  "river>=0.23",
  "scikit-learn>=1.6",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16", "mypy>=1", "bandit>=1"]
figures = ["PyMuPDF>=1.28"]

[project.scripts]
fraudx = "fraudx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/fraudx/paysim_deterministic/*.py" = ["E501"]
"tests/test_paysim_deterministic.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Frozen NumPy/Pandas kernels return arrays through untyped third-party interfaces.
# Preserve the original scientific source; all other type diagnostics remain active.
[[tool.mypy.overrides]]
module = ["fraudx.cross_model.statistics", "fraudx.cross_model.training", "fraudx.cross_model.analysis"]
warn_return_any = false
